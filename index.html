<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>位置分享</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182230; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; }
    main { width: min(92vw, 520px); box-sizing: border-box; background: white; padding: 28px; border-radius: 18px; box-shadow: 0 8px 32px #16243a18; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { line-height: 1.65; }
    .notice { background: #f4f7fb; border-radius: 12px; padding: 14px; font-size: .95rem; overflow-wrap: anywhere; }
    label { display: flex; gap: 10px; align-items: flex-start; margin: 18px 0; line-height: 1.5; }
    input { margin-top: 4px; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 1rem; font-weight: 700; background: #1769d2; color: white; }
    button:disabled { opacity: .55; }
    #status { min-height: 3em; margin-top: 16px; white-space: pre-wrap; }
    .small { color: #5d6878; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>分享你目前的位置</h1>
  <p>只有在你勾選同意並按下下方按鈕後，這個頁面才會向手機要求一次性定位，並將座標、定位精度及時間寄送給頁面事先標示的收件者。</p>
  <div class="notice">
    <strong>位置接收者：</strong>網站管理者設定的 Yahoo 信箱<br>
    <strong>用途：</strong>接收你此刻主動分享的位置。<br>
    <strong>資料範圍：</strong>單次 GPS 座標、精度及分享時間；不會持續追蹤。
  </div>
  <label>
    <input id="consent" type="checkbox">
    <span>我已閱讀以上說明，並同意將我此刻的位置分享給上述收件者。</span>
  </label>
  <button id="share" type="button">同意並分享目前位置</button>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="small">你可以拒絕定位權限或關閉此頁面。定位需要 HTTPS 網址及瀏覽器定位權限。</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // EmailJS 設定（已填入你提供的三項識別資料）
  const EMAILJS_PUBLIC_KEY = "UnsCvVbafOrxoaWHQ";
  const EMAILJS_SERVICE_ID = "service_ri46wwo";
  const EMAILJS_TEMPLATE_ID = "template_fa3hbh8";

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  const statusEl = document.getElementById("status");
  const button = document.getElementById("share");
  const consent = document.getElementById("consent");

  function setStatus(message) { statusEl.textContent = message; }

  button.addEventListener("click", () => {
    if (!consent.checked) {
      setStatus("請先勾選同意欄位，才能分享位置。");
      return;
    }
    if (!navigator.geolocation) {
      setStatus("此瀏覽器不支援定位功能。");
      return;
    }

    button.disabled = true;
    setStatus("正在向手機要求定位權限……請依瀏覽器提示選擇允許。");

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);
      const timestamp = new Date(position.timestamp).toLocaleString("zh-TW", { hour12: false });
      const mapsUrl = `https://www.google.com/maps?q=${encodeURIComponent(lat + "," + lon)}`;
      const shareId = new URLSearchParams(location.search).get("id") || "一般分享連結";

      setStatus("已取得位置，正在寄送通知……");
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          share_id: shareId,
          latitude: lat.toFixed(6),
          longitude: lon.toFixed(6),
          accuracy_m: accuracy,
          shared_at: timestamp,
          maps_url: mapsUrl,
          recipient_label: "網站管理者設定的 Yahoo 信箱",
          consent_statement: "分享者已勾選同意，並按下「同意並分享目前位置」。"
        });
        setStatus("位置分享成功，通知已送出。你可以關閉此頁面。");
      } catch (error) {
        console.error("EmailJS send failed:", error);
        setStatus("位置已取得，但通知寄送失敗。請稍後再試，或聯絡網站管理者。");
        button.disabled = false;
      }
    }, (error) => {
      const messages = {
        1: "你拒絕了定位權限。沒有取得或寄送位置。",
        2: "目前無法判定位置，請確認手機定位服務已開啟後再試。",
        3: "定位逾時，請在訊號較好的地方再試。"
      };
      setStatus(messages[error.code] || "定位失敗，沒有寄送位置。");
      button.disabled = false;
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
</script>
</body>
</html>
